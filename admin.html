<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrator Panel</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="page-admin" data-page="admin">
    <div class="page-shell">
      <header class="hero">
        <button id="backBtn" class="secondary-btn" type="button">← Back</button>
        <h1>Administrator Panel</h1>
        <div class="banner">Manage marks, refresh insights, and keep the class report current.</div>
      </header>

      <main class="card admin-card">
        <div class="admin-toolbar">
          <button class="chip-btn active" data-panel="edit">Edit marks</button>
          <button class="chip-btn" data-panel="input">Input marks</button>
          <button class="chip-btn" data-panel="clear">Clear data</button>
          <button class="chip-btn" data-panel="pin">Change PIN</button>
        </div>

        <section id="editPanel" class="admin-panel active"></section>
        <section id="inputPanel" class="admin-panel"></section>
        <section id="clearPanel" class="admin-panel"></section>
        <section id="pinPanel" class="admin-panel"></section>
      </main>

      <footer class="site-footer">
        <span>© 2026 Vihela Panawala. All rights reserved.</span>
        <a class="instagram-link" href="https://www.instagram.com/v1h3l4/" target="_blank" rel="noopener" aria-label="Visit Instagram profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4.5"></circle>
            <circle cx="17.5" cy="6.5" r="1"></circle>
          </svg>
        </a>
      </footer>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
