<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Evaluation Report</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="page-student" data-page="student">
    <div class="page-shell">
      <header class="hero student-hero">
        <div class="hero-row">
          <button id="backBtn" class="secondary-btn" type="button">← Back</button>
          <h1 id="greeting">HI STUDENT, Here's your personal evaluation report. GOOD LUCK!</h1>
          <div id="studentBadge" class="student-badge"></div>
        </div>
        <div class="tab-row" role="tablist" aria-label="Student sections">
          <button class="tab-btn active" data-view="paper">Paper Marksheet</button>
          <button class="tab-btn" data-view="progress">Personal Progress</button>
          <button class="tab-btn" data-view="dashboard">Dashboard</button>
        </div>
      </header>

      <main class="card">
        <section id="paperSection" class="content-pane active">
          <div class="section-head">
            <h2>Paper Marksheet</h2>
            <label class="inline-field" for="paperSelect">
              <span>Paper</span>
              <select id="paperSelect"></select>
            </label>
          </div>
          <div id="paperContent"></div>
        </section>

        <section id="progressSection" class="content-pane">
          <div class="section-head">
            <h2>Personal Progress</h2>
            <div id="chartFilters" class="chip-row"></div>
          </div>
          <div id="progressContent"></div>
        </section>

        <section id="dashboardSection" class="content-pane">
          <div class="section-head">
            <h2>Dashboard</h2>
          </div>
          <div id="dashboardContent"></div>
        </section>
      </main>

      <footer class="site-footer">
        <span>© 2026 Vihela Panawala. All rights reserved.</span>
        <a class="instagram-link" href="https://www.instagram.com/v1h3l4/" target="_blank" rel="noopener" aria-label="Visit Instagram profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4.5"></circle>
            <circle cx="17.5" cy="6.5" r="1"></circle>
          </svg>
        </a>
      </footer>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
